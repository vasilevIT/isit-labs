# PostgreSQL 16 для лабораторной работы №8
# Запуск:        docker compose up -d
# Консоль psql:  docker compose exec db psql -U postgres -d taskdb
# Папка sql/ видна внутри контейнера как /sql, поэтому в psql работает \i /sql/01_schema.sql
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./sql:/sql
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
