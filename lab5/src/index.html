<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Задачи команды</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <h1>Задачи команды</h1>

    <!-- Форма: сюда пользователь вводит данные новой задачи -->
    <form id="task-form" class="card">
      <h2>Новая задача</h2>

      <label for="task-title">Название</label>
      <input id="task-title" type="text">
      <div class="error" id="error-title"></div>

      <label for="task-priority">Приоритет</label>
      <select id="task-priority">
        <option value="low">Низкий</option>
        <option value="medium" selected>Средний</option>
        <option value="high">Высокий</option>
      </select>

      <br><br>
      <button type="submit" class="primary">Добавить в список</button>
    </form>

    <h2>Список задач</h2>

    <!-- Элементы управления: список для выбора, поле ввода, кнопка -->
    <div class="toolbar">
      <select id="status-filter">
        <option value="">Все статусы</option>
        <option value="new">Новая</option>
        <option value="in_progress">В работе</option>
        <option value="done">Выполнена</option>
      </select>
      <input id="search-input" type="text" placeholder="Поиск по названию...">
      <button id="refresh-button">Загрузить с сервера</button>
    </div>

    <!-- Область отображения информации: «Загрузка…», «Ничего не найдено», ошибки -->
    <div id="info" class="message">Нажмите «Загрузить с сервера»</div>

    <!-- Таблицу заполняет JavaScript -->
    <table id="task-table" hidden>
      <thead>
        <tr>
          <th>№</th>
          <th>Название</th>
          <th>Статус</th>
          <th>Приоритет</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="task-body"></tbody>
    </table>

    <p>Задач на странице: <strong id="counter">0</strong></p>
  </div>

  <!-- Скрипты подключаются в конце страницы, когда вся разметка уже загружена -->
  <script src="js/mock-data.js"></script>   <!-- данные и таблица запросов учебного сервера (редактируете вы) -->
  <script src="js/mock-api.js"></script>    <!-- «движок» учебного сервера (не менять) -->
  <script src="js/app.js"></script>
</body>
</html>
